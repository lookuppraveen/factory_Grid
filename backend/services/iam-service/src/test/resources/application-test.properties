# Kept as .properties because @TestPropertySource does not load YAML.
# Secrets come from environment variables (DB_PASSWORD, JWT_SECRET); nothing is hard-coded.
spring.application.name=iam-service-test
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${TEST_DB_NAME:factorygrid_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=86400000
cors.allowed-origins=http://localhost:5173
bootstrap.admin.enabled=false
