info:
  title: FactoryGrid API
  description: FactoryGrid B2B pharmaceutical manufacturing marketplace API.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    BuyerRegistrationDto:
      type: object
      properties:
        username:
          type: string
          example: buyer_pharma_01
          minLength: 3
          maxLength: 50
        email:
          type: string
          example: buyer@pharmaco.in
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        phone:
          type: string
        companyName:
          type: string
        companyCode:
          type: string
          description: Generated when omitted.
        department:
          type: string
        jobTitle:
          type: string
      required:
        - username
        - email
        - password
        - fullName
        - companyName
    UserProfileDto:
      type: object
      properties:
        id:
          type: number
        userCode:
          type: string
        username:
          type: string
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
        companyCode:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        jobTitle:
          type: string
          nullable: true
        accountStatus:
          type: string
          example: ACTIVE
        roles:
          example:
            - ROLE_BUYER
          type: array
          items:
            type: string
        lastLoginAt:
          type: string
          nullable: true
      required:
        - id
        - userCode
        - username
        - email
        - fullName
        - phone
        - companyName
        - companyCode
        - department
        - jobTitle
        - accountStatus
        - roles
        - lastLoginAt
    RegistrationResponseDto:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        user:
          $ref: '#/components/schemas/UserProfileDto'
        timestamp:
          type: string
      required:
        - success
        - message
        - user
        - timestamp
    ErrorResponseDto:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: string
          description: Field-level messages, only on validation failures.
          example:
            email: Please provide a valid email address
        status:
          type: number
          example: 401
        error:
          type: string
          example: Unauthorized
        message:
          type: string
        timestamp:
          type: string
        path:
          type: string
      required:
        - status
        - error
        - message
        - timestamp
        - path
    ManufacturerRegistrationDto:
      type: object
      properties:
        username:
          type: string
          example: buyer_pharma_01
          minLength: 3
          maxLength: 50
        email:
          type: string
          example: buyer@pharmaco.in
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        phone:
          type: string
        companyName:
          type: string
        companyCode:
          type: string
          description: Generated when omitted.
        department:
          type: string
        jobTitle:
          type: string
        factoryDetails:
          type: string
          description: Accepted for compatibility; stored by the partner module in Phase 2.
      required:
        - username
        - email
        - password
        - fullName
        - companyName
    LoginDto:
      type: object
      properties:
        usernameOrEmail:
          type: string
          example: admin
        password:
          type: string
        portalType:
          type: string
          description: 'Optional portal check: BUYER, MANUFACTURER, SUPPLIER, FG_STAFF, STAFF or ADMIN.'
      required:
        - usernameOrEmail
        - password
    AuthResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Access token lifetime in milliseconds.
        user:
          $ref: '#/components/schemas/UserProfileDto'
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - user
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    TokenRefreshResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Access token lifetime in milliseconds.
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    LogoutDto:
      type: object
      properties:
        refreshToken:
          type: string
    MessageResponseDto:
      type: object
      properties:
        data:
          type: object
          nullable: true
          example: null
        success:
          type: boolean
        message:
          type: string
        timestamp:
          type: string
      required:
        - data
        - success
        - message
        - timestamp
    UserListResponseDto:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileDto'
        timestamp:
          type: string
      required:
        - success
        - message
        - data
        - timestamp
    PortalAccessDataDto:
      type: object
      properties:
        authorities:
          type: array
          items:
            type: object
            properties:
              authority:
                type: string
          example:
            - authority: ROLE_BUYER
        portal:
          type: string
          example: BUYER
        accessibleBy:
          type: string
        message:
          type: string
      required:
        - authorities
        - portal
        - accessibleBy
        - message
    PortalAccessResponseDto:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/PortalAccessDataDto'
        timestamp:
          type: string
      required:
        - success
        - message
        - data
        - timestamp
    PortalProfileResponseDto:
      type: object
      properties:
        data:
          type: object
          additionalProperties:
            type: string
          example:
            username: buyer_pharma_01
            role: BUYER
        success:
          type: boolean
        message:
          type: string
        timestamp:
          type: string
      required:
        - data
        - success
        - message
        - timestamp
