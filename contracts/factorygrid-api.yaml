      operationId: RfqController_createRfq
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRfqDto'
      responses:
        '201':
          description: RFQ created successfully
      security:
        - bearer: []
      summary: Create or draft a new Buyer RFQ
      tags:
        - Buyer RFQ Workflow
    get:
      description: Returns all RFQs belonging to the authenticated buyer. Administrators can view all RFQs.
      operationId: RfqController_listRfqs
      parameters:
        - name: status
          required: false
          in: query
          description: Filter by status (Draft, Submitted, etc.)
          schema:
            type: string
        - name: search
          required: false
          in: query
          description: Search term for RFQ number, company, or product
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: List RFQs for current authenticated buyer
      tags:
        - Buyer RFQ Workflow
  /api/v1/buyer/rfqs/{id}:
    get:
      operationId: RfqController_getRfq
      parameters:
        - name: id
          required: true
          in: path
          description: RFQ numeric ID
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Get single RFQ details with product lines
      tags:
        - Buyer RFQ Workflow
    put:
      operationId: RfqController_updateRfq
      parameters:
        - name: id
          required: true
          in: path
          description: RFQ numeric ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRfqDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Update an existing draft RFQ
      tags:
        - Buyer RFQ Workflow
  /api/v1/buyer/rfqs/{id}/submit:
    post:
      operationId: RfqController_submitRfq
      parameters:
        - name: id
          required: true
          in: path
          description: RFQ numeric ID
          schema:
            type: string
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: Submit a valid draft RFQ for pricing and manufacturer distribution
      tags:
        - Buyer RFQ Workflow
  /api/v1/buyer/rfqs/{id}/match:
    post:
      description: Matches eligible manufacturers for products in the RFQ. Does NOT submit the RFQ.
      operationId: RfqController_matchManufacturers
      parameters:
        - name: id
          required: true
          in: path
          description: RFQ numeric ID
          schema:
            type: string
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: Run AI/Rule-based manufacturer matching against real PostgreSQL records
      tags:
        - Buyer RFQ Workflow
info:
  title: FactoryGrid API
  description: FactoryGrid B2B pharmaceutical manufacturing marketplace API.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Step1CompanyDto:
      type: object
      properties:
        companyName:
          type: string
          description: Registered company name
          example: Apex Care Pharma Ltd
        businessType:
          enum:
            - PCD Franchise
            - PCD Franchise Customer
            - PCD
            - Third Party Manufacturing (TPM)
            - Third Party Manufacturing
            - TPM
            - Distributor
            - DISTRIBUTOR
            - Wholesaler
            - WHOLESALER
            - Hospital
            - HOSPITAL
            - Export
            - Export Customer
            - EXPORT
            - Export House
            - Private Limited
            - Public Limited
            - Partnership Firm
            - Proprietorship
            - Healthcare Institution
            - Registered Enterprise
          type: string
          description: Business model type
          example: PCD Franchise
        gstNumber:
          type: string
          description: 15-character Goods and Services Tax Identification Number (GSTIN)
          example: 07AAAAA0000A1Z5
        panNumber:
          type: string
          description: 10-character Permanent Account Number (PAN)
          example: AAAAA0000A
        drugLicenseNumber:
          type: string
          description: State / Central Drug License number (Form 20B/21B)
          example: DL-20B/21B/2024/991
        cinNumber:
          type: string
          description: Corporate Identification Number (CIN)
          example: U24232DL2020PTC361234
        website:
          type: string
          description: Official corporate website URL
          example: https://apexpharma.in
      required:
        - companyName
        - businessType
        - gstNumber
        - panNumber
        - drugLicenseNumber
    StepResponseDto:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Step saved successfully
        registrationCode:
          type: string
          example: REG-BUYER-172889201923
        currentStep:
          type: number
          example: 1
      required:
        - success
        - message
        - registrationCode
        - currentStep
    Step2ContactDto:
      type: object
      properties:
        contactPerson:
          type: string
          description: Primary contact person or representative
          example: Vikram Mehta
        designation:
          type: string
          description: Designation / job title of contact person
          example: Director
        mobileNumber:
          type: string
          description: Mobile / Phone number
          example: +91 98765 43210
        email:
          type: string
          format: email
          description: Corporate email address
          example: vikram@apexpharma.in
        password:
          type: string
          description: Buyer account password
          example: Password@123
      required:
        - contactPerson
        - designation
        - mobileNumber
        - email
    PcdDetailsDto:
      type: object
      properties:
        territory:
          type: string
          example: North Zone
        state:
          type: string
          example: Delhi NCR
        district:
          type: string
          example: South Delhi
        monopolyRights:
          type: boolean
          example: true
        brandPortfolio:
          type: string
          example: Cardiology, Diabetology, General Formulations
    TpmDetailsDto:
      type: object
      properties:
        brandName:
          type: string
          example: BioCure Formulations
        packagingRequirements:
          type: string
          example: Alu-Alu Packaging
        artworkApproval:
          type: boolean
          example: true
        regulatoryRequirements:
          type: string
          example: Form 25/28 License Required
        moqAgreement:
          type: boolean
          example: true
    DistributorDetailsDto:
      type: object
      properties:
        distributionTerritory:
          type: string
          example: Regional Territory
        salesChannel:
          type: string
          example: Retail Pharmacy & Hospitals
        warehouseLocations:
          type: string
          example: Central Warehouse (10,000 sq ft)
    HospitalDetailsDto:
      type: object
      properties:
        procurementDepartment:
          type: string
          example: Central Clinical Procurement
        tenderReference:
          type: string
          example: TENDER-2026-88
        contractValidity:
          type: string
          example: Valid till Dec 2027
    WholesalerDetailsDto:
      type: object
      properties:
        storageCapacitySqFt:
          type: string
          example: 5,000 sq ft
        coldChainStorage:
          type: boolean
          example: true
        networkSize:
          type: string
          example: 25 Retail Outlets
    ExportDetailsDto:
      type: object
      properties:
        targetRegions:
          type: string
          example: LATAM, Southeast Asia
        iecCode:
          type: string
          example: '0304991204'
    Step3AddressDto:
      type: object
      properties:
        billingAddress:
          type: string
          description: Registered Billing Address
          example: Plot 45, Okhla Industrial Area Phase III
        shippingAddress:
          type: string
          description: Shipping / Delivery Warehouse Address
          example: Warehouse 2, Kundli Industrial Corridor
        state:
          type: string
          description: State
          example: Delhi
        country:
          type: string
          default: India
          description: Country
          example: India
        pincode:
          type: string
          description: 6-digit Postal Pincode
          example: '110020'
        pcdDetails:
          description: PCD Franchise specific details
          allOf:
            - $ref: '#/components/schemas/PcdDetailsDto'
        tpmDetails:
          description: Third Party Manufacturing specific details
          allOf:
            - $ref: '#/components/schemas/TpmDetailsDto'
        distributorDetails:
          description: Distributor specific details
          allOf:
            - $ref: '#/components/schemas/DistributorDetailsDto'
        hospitalDetails:
          description: Hospital specific details
          allOf:
            - $ref: '#/components/schemas/HospitalDetailsDto'
        wholesalerDetails:
          description: Wholesaler specific details
          allOf:
            - $ref: '#/components/schemas/WholesalerDetailsDto'
        exportDetails:
          description: Export specific details
          allOf:
            - $ref: '#/components/schemas/ExportDetailsDto'
      required:
        - billingAddress
        - shippingAddress
        - state
        - country
        - pincode
    UploadDocumentResponseDto:
      type: object
      properties:
        id:
          type: string
          example: '1'
        documentCode:
          type: string
          example: DOC-GST-172889201923
        registrationId:
          type: string
          example: '1'
        category:
          type: string
