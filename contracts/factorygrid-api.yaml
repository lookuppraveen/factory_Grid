            - GST Certificate
            - Drug License
            - PAN Card
            - Incorporation Certificate
            - Cancelled Cheque
            - Signed Agreement
        categoryDisplayName:
          type: string
          example: GST Certificate
        fileName:
          type: string
          example: GST_Registration_Cert.pdf
        fileSize:
          type: number
          example: 1258291
        mimeType:
          type: string
          example: application/pdf
        status:
          type: string
          example: VALID
        rejectionReason:
          type: string
          example: Document illegible or missing seal
        reviewedBy:
          type: string
          example: Rajesh Kumar (Compliance Desk A)
        reviewedAt:
          type: string
          example: '2026-10-14T10:00:00.000Z'
        reviewDecision:
          type: string
          example: REJECTED
        version:
          type: number
          example: 1
        uploadedAt:
          type: string
          example: '2026-10-13T10:00:00.000Z'
      required:
