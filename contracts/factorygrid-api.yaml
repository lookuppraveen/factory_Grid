            - Third Party Manufacturing (TPM)
            - Third Party Manufacturing
            - TPM
            - Distributor
            - DISTRIBUTOR
            - Wholesaler
            - WHOLESALER
            - Hospital
            - HOSPITAL
            - Export
            - Export Customer
            - EXPORT
            - Export House
            - Private Limited
            - Public Limited
            - Partnership Firm
            - Proprietorship
            - Healthcare Institution
            - Registered Enterprise
          type: string
