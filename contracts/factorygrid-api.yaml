          type: string
          nullable: true
          example: '2026-01-01'
        expiryDate:
          type: string
          nullable: true
          example: '2030-10-15'
        fileName:
          type: string
          example: TM_Certificate.pdf
        fileSize:
          type: number
          example: 2097152
        mimeType:
          type: string
          example: application/pdf
        status:
          type: string
          example: UNDER REVIEW
        checks:
          type: object
          additionalProperties:
            type: string
          nullable: true
