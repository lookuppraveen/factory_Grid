        companyCode:
          type: string
          description: Company code (auto-generated if omitted)
          example: APEX01
        department:
          type: string
          description: Department
          example: Procurement
        billingAddress:
          type: string
          description: Registered Billing Address
          example: Plot 45, Okhla Industrial Area Phase III
        shippingAddress:
          type: string
          description: Shipping / Warehouse Address
          example: Warehouse 2, Kundli Industrial Corridor
        state:
          type: string
          description: State
          example: Delhi
        country:
          type: string
          default: India
          description: Country
          example: India
        pincode:
          type: string
          description: 6-digit Postal Pincode
          example: '110020'
        pcdDetails:
          description: PCD Franchise specific details
          allOf:
            - $ref: '#/components/schemas/PcdDetailsDto'
        tpmDetails:
          description: Third Party Manufacturing specific details
          allOf:
            - $ref: '#/components/schemas/TpmDetailsDto'
        distributorDetails:
          description: Distributor specific details
          allOf:
            - $ref: '#/components/schemas/DistributorDetailsDto'
        hospitalDetails:
          description: Hospital specific details
          allOf:
            - $ref: '#/components/schemas/HospitalDetailsDto'
        wholesalerDetails:
          description: Wholesaler specific details
          allOf:
            - $ref: '#/components/schemas/WholesalerDetailsDto'
        exportDetails:
          description: Export specific details
          allOf:
            - $ref: '#/components/schemas/ExportDetailsDto'
        confirmAccurate:
          type: boolean
          description: Confirmation of data accuracy checkbox
          default: true
      required:
        - registrationCode
        - companyName
        - businessType
        - gstNumber
        - panNumber
        - drugLicenseNumber
        - contactPerson
        - designation
        - mobileNumber
        - email
        - billingAddress
        - shippingAddress
        - state
        - country
        - pincode
    AutoValidationResultDto:
      type: object
      properties:
        gstCheck:
          type: string
          example: Valid
        panCheck:
          type: string
          example: Valid
        requiredDocsCheck:
          type: string
          example: Valid
        requiredFieldsCheck:
          type: string
          example: Valid
        overallStatus:
          type: string
          example: Valid
        validationDetails:
          example:
            - GSTIN structure format verified.
            - PAN structure format verified.
            - All 6 required onboarding documents present.
            - Required corporate details populated.
          type: array
          items:
            type: string
        governmentVerified:
          type: boolean
          example: false
          description: True if verified against official government portal
        testingAccepted:
          type: boolean
          example: true
          description: True if accepted for testing purpose
      required:
        - gstCheck
        - panCheck
        - requiredDocsCheck
        - requiredFieldsCheck
