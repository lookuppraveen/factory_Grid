        - status
        - createdAt
        - updatedAt
    ManufacturerStep1Dto:
      type: object
      properties:
        companyName:
          type: string
          maxLength: 150
          example: SunBio LifeSciences Pvt. Ltd.
        facilityAddress:
          type: string
          maxLength: 500
          example: Plot 42, IDA Pashamylaram, Phase III
        city:
          type: string
          maxLength: 100
          example: Hyderabad
        state:
          type: string
          maxLength: 100
          example: Telangana
        pincode:
          type: string
          pattern: ^[1-9][0-9]{5}$
          example: '502307'
          description: 6-digit Indian pincode
        mfgCapacity:
          type: string
          maxLength: 150
          example: 10,000,000 Units / Month
          description: Plant manufacturing capacity (optional)
        contactPerson:
          type: string
          maxLength: 150
          example: Dr. Vikram Sethi
        designation:
          type: string
          maxLength: 100
          example: Plant Head / Director
        email:
          type: string
          maxLength: 150
          format: email
          example: plant@sunbiolabs.com
          description: Email address (also the login identifier)
        phone:
          type: string
          example: +91 98765 43210
      required:
        - companyName
        - facilityAddress
        - city
        - state
        - pincode
        - contactPerson
        - designation
        - email
        - phone
    ManufacturerStepResponseDto:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Company details saved successfully
        registrationCode:
          type: string
          example: REG-MFG-1A2B3C4D5E6F7A8B
        currentStep:
          type: number
          example: 1
      required:
        - success
        - message
        - registrationCode
        - currentStep
    ManufacturerDocumentDatesDto:
      type: object
      properties:
        category:
          type: string
          example: mfgLicense
          enum:
            - mfgLicense
            - gmpCert
            - whoGmpCert
            - isoCert
            - pollutionCert
            - factoryReg
            - otherCert
        issueDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2023-04-15'
          description: ISO date (YYYY-MM-DD); must not be in the future
        expiryDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2028-04-14'
          description: ISO date (YYYY-MM-DD); must be after issueDate and not already expired
        documentNumber:
          type: string
          maxLength: 100
          example: GMP-MH-2023-4819
          description: Official registration or license number
      required:
        - category
    ManufacturerStep2Dto:
      type: object
      properties:
        documents:
          description: Issue/expiry dates for the uploaded certifications
          type: array
          items:
            $ref: '#/components/schemas/ManufacturerDocumentDatesDto'
        whoGmpApplicable:
          type: boolean
          example: true
          description: >-
            Whether WHO-GMP is applicable to this manufacturing facility (defaults to true; set to false for domestic
            Schedule M only facilities)
    ManufacturerStep3Dto:
      type: object
      properties:
        categoryIds:
          uniqueItems: true
          example:
            - cat-tablets
            - cat-capsules
          description: Manufacturing category IDs
          type: array
          items:
            type: string
        productIds:
          uniqueItems: true
          example:
            - p1
            - p2
          description: Catalogue product IDs; replaces the saved selection
          type: array
          items:
            type: string
    ManufacturerSupplyItemDto:
      type: object
      properties:
        productId:
          type: string
          example: p1
        categoryId:
          type: string
          example: cat-tablets
        batchSize:
          type: number
          minimum: 1
          maximum: 2000000000
          example: 1000
          description: Batch Size / Minimum order quantity (positive integer)
        moq:
          type: number
          minimum: 1
          maximum: 2000000000
          example: 1000
          description: Minimum order quantity (positive integer)
        deliveryScheduleDays:
          type: number
          minimum: 1
          maximum: 3650
          example: 14
          description: Delivery schedule in days (positive integer)
        leadTimeDays:
          type: number
          minimum: 1
          maximum: 3650
          example: 14
          description: Typical production delivery schedule in days (positive integer)
    ManufacturerStep4Dto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManufacturerSupplyItemDto'
      required:
        - items
    ManufacturerSubmitDto:
      type: object
      properties:
        registrationCode:
          type: string
          example: REG-MFG-1A2B3C4D5E6F7A8B
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: Str0ngPass!
          description: Password for the manufacturer portal login (stored as a bcrypt hash)
        confirmAccurate:
          type: boolean
          example: true
          description: Declaration that all information and documents are accurate
        whoGmpApplicable:
          type: boolean
          example: true
          description: Whether WHO-GMP is applicable to this facility
      required:
        - registrationCode
