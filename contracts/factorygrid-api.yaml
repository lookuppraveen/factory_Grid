info:
  title: FactoryGrid API
  description: FactoryGrid B2B pharmaceutical manufacturing marketplace API.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Step1CompanyDto:
      type: object
      properties:
        companyName:
          type: string
          description: Registered company name
          example: Apex Care Pharma Ltd
        businessType:
          enum:
            - PCD Franchise
            - PCD Franchise Customer
            - PCD
            - Third Party Manufacturing (TPM)
            - Third Party Manufacturing
            - TPM
            - Distributor
            - DISTRIBUTOR
            - Wholesaler
            - WHOLESALER
            - Hospital
            - HOSPITAL
            - Export
            - Export Customer
            - EXPORT
            - Export House
            - Private Limited
            - Public Limited
            - Partnership Firm
            - Proprietorship
            - Healthcare Institution
            - Registered Enterprise
          type: string
          description: Business model type
          example: PCD Franchise
        gstNumber:
          type: string
          description: 15-character Goods and Services Tax Identification Number (GSTIN)
          example: 07AAAAA0000A1Z5
        panNumber:
          type: string
          description: 10-character Permanent Account Number (PAN)
          example: AAAAA0000A
        drugLicenseNumber:
          type: string
          description: State / Central Drug License number (Form 20B/21B)
          example: DL-20B/21B/2024/991
        cinNumber:
          type: string
          description: Corporate Identification Number (CIN)
          example: U24232DL2020PTC361234
        website:
          type: string
          description: Official corporate website URL
          example: https://apexpharma.in
      required:
        - companyName
        - businessType
        - gstNumber
        - panNumber
        - drugLicenseNumber
    StepResponseDto:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Step saved successfully
        registrationCode:
          type: string
          example: REG-BUYER-172889201923
        currentStep:
          type: number
          example: 1
      required:
        - success
        - message
        - registrationCode
        - currentStep
    Step2ContactDto:
      type: object
      properties:
        contactPerson:
          type: string
          description: Primary contact person or representative
          example: Vikram Mehta
        designation:
          type: string
          description: Designation / job title of contact person
          example: Director
        mobileNumber:
          type: string
          description: Mobile / Phone number
          example: +91 98765 43210
        email:
          type: string
          format: email
          description: Corporate email address
          example: vikram@apexpharma.in
        password:
          type: string
          description: Buyer account password
          example: Password@123
      required:
        - contactPerson
        - designation
        - mobileNumber
        - email
    PcdDetailsDto:
      type: object
      properties:
        territory:
          type: string
          example: North Zone
        state:
          type: string
          example: Delhi NCR
        district:
          type: string
          example: South Delhi
        monopolyRights:
          type: boolean
          example: true
        brandPortfolio:
          type: string
          example: Cardiology, Diabetology, General Formulations
    TpmDetailsDto:
      type: object
      properties:
        brandName:
          type: string
          example: BioCure Formulations
        packagingRequirements:
          type: string
          example: Alu-Alu Packaging
        artworkApproval:
          type: boolean
          example: true
        regulatoryRequirements:
          type: string
          example: Form 25/28 License Required
        moqAgreement:
          type: boolean
          example: true
    DistributorDetailsDto:
      type: object
      properties:
        distributionTerritory:
          type: string
          example: Regional Territory
        salesChannel:
          type: string
          example: Retail Pharmacy & Hospitals
        warehouseLocations:
          type: string
          example: Central Warehouse (10,000 sq ft)
    HospitalDetailsDto:
      type: object
      properties:
        procurementDepartment:
          type: string
          example: Central Clinical Procurement
        tenderReference:
          type: string
          example: TENDER-2026-88
        contractValidity:
          type: string
          example: Valid till Dec 2027
    WholesalerDetailsDto:
      type: object
      properties:
        storageCapacitySqFt:
          type: string
          example: 5,000 sq ft
        coldChainStorage:
          type: boolean
          example: true
        networkSize:
          type: string
          example: 25 Retail Outlets
    ExportDetailsDto:
      type: object
      properties:
        targetRegions:
          type: string
          example: LATAM, Southeast Asia
        iecCode:
          type: string
          example: '0304991204'
    Step3AddressDto:
      type: object
      properties:
        billingAddress:
          type: string
          description: Registered Billing Address
          example: Plot 45, Okhla Industrial Area Phase III
        shippingAddress:
          type: string
          description: Shipping / Delivery Warehouse Address
          example: Warehouse 2, Kundli Industrial Corridor
        state:
          type: string
          description: State
          example: Delhi
        country:
          type: string
          default: India
          description: Country
          example: India
        pincode:
          type: string
          description: 6-digit Postal Pincode
          example: '110020'
        pcdDetails:
          description: PCD Franchise specific details
          allOf:
            - $ref: '#/components/schemas/PcdDetailsDto'
        tpmDetails:
          description: Third Party Manufacturing specific details
          allOf:
            - $ref: '#/components/schemas/TpmDetailsDto'
        distributorDetails:
          description: Distributor specific details
          allOf:
            - $ref: '#/components/schemas/DistributorDetailsDto'
        hospitalDetails:
          description: Hospital specific details
          allOf:
            - $ref: '#/components/schemas/HospitalDetailsDto'
        wholesalerDetails:
          description: Wholesaler specific details
          allOf:
            - $ref: '#/components/schemas/WholesalerDetailsDto'
        exportDetails:
          description: Export specific details
          allOf:
            - $ref: '#/components/schemas/ExportDetailsDto'
      required:
        - billingAddress
        - shippingAddress
        - state
        - country
        - pincode
    UploadDocumentResponseDto:
      type: object
      properties:
        id:
          type: string
          example: '1'
        documentCode:
          type: string
          example: DOC-GST-172889201923
        registrationId:
          type: string
          example: '1'
        category:
          type: string
          example: GST Certificate
          enum:
            - GST Certificate
            - Drug License
            - PAN Card
            - Incorporation Certificate
            - Cancelled Cheque
            - Signed Agreement
        categoryDisplayName:
          type: string
          example: GST Certificate
        fileName:
          type: string
          example: GST_Registration_Cert.pdf
        fileSize:
          type: number
          example: 1258291
        mimeType:
          type: string
          example: application/pdf
        status:
          type: string
          example: VALID
        rejectionReason:
          type: string
          example: Document illegible or missing seal
        reviewedBy:
          type: string
          example: Rajesh Kumar (Compliance Desk A)
        reviewedAt:
          type: string
          example: '2026-10-14T10:00:00.000Z'
        reviewDecision:
          type: string
          example: REJECTED
        version:
          type: number
          example: 1
        uploadedAt:
          type: string
          example: '2026-10-13T10:00:00.000Z'
      required:
        - id
        - documentCode
        - registrationId
        - category
        - categoryDisplayName
        - fileName
        - fileSize
        - mimeType
        - status
        - uploadedAt
    BuyerFullRegistrationDto:
      type: object
      properties:
        registrationCode:
          type: string
          description: Registration code returned by step-1; links the submission to the saved draft and uploaded documents
          example: REG-BUYER-3F9A1C7D2B4E6A80
        companyName:
          type: string
          description: Registered company name
          example: Apex Care Pharma Ltd
        businessType:
          enum:
            - PCD Franchise
            - PCD Franchise Customer
            - PCD
            - Third Party Manufacturing (TPM)
            - Third Party Manufacturing
            - TPM
            - Distributor
            - DISTRIBUTOR
            - Wholesaler
            - WHOLESALER
            - Hospital
            - HOSPITAL
            - Export
            - Export Customer
            - EXPORT
            - Export House
            - Private Limited
            - Public Limited
            - Partnership Firm
            - Proprietorship
            - Healthcare Institution
            - Registered Enterprise
          type: string
          description: Business model type
          example: PCD Franchise
        gstNumber:
          type: string
          description: Goods and Services Tax Identification Number (GSTIN)
          example: 07AAAAA0000A1Z5
        panNumber:
          type: string
          description: Permanent Account Number (PAN)
          example: AAAAA0000A
        drugLicenseNumber:
          type: string
          description: State / Central Drug License number (Form 20B/21B)
          example: DL-20B/21B/2024/991
        cinNumber:
          type: string
          description: Corporate Identification Number (CIN)
          example: U24232DL2020PTC361234
        website:
          type: string
          description: Official corporate website URL
          example: https://apexpharma.in
        contactPerson:
          type: string
          description: Primary contact person or representative
          example: Vikram Mehta
        designation:
          type: string
          description: Designation / job title of contact person
          example: Director
        mobileNumber:
          type: string
          description: Mobile / Phone number
          example: +91 98765 43210
        email:
          type: string
          format: email
          description: Corporate email address
          example: vikram@apexpharma.in
        username:
          type: string
          description: Account username (generated from email if omitted)
          example: vikram_apex
        password:
          type: string
          description: Account password (default generated if omitted)
          example: Password@123
        companyCode:
          type: string
          description: Company code (auto-generated if omitted)
          example: APEX01
        department:
          type: string
          description: Department
          example: Procurement
        billingAddress:
          type: string
          description: Registered Billing Address
          example: Plot 45, Okhla Industrial Area Phase III
        shippingAddress:
          type: string
          description: Shipping / Warehouse Address
          example: Warehouse 2, Kundli Industrial Corridor
        state:
          type: string
          description: State
          example: Delhi
        country:
          type: string
          default: India
          description: Country
          example: India
        pincode:
          type: string
          description: 6-digit Postal Pincode
          example: '110020'
        pcdDetails:
          description: PCD Franchise specific details
          allOf:
            - $ref: '#/components/schemas/PcdDetailsDto'
        tpmDetails:
          description: Third Party Manufacturing specific details
          allOf:
            - $ref: '#/components/schemas/TpmDetailsDto'
        distributorDetails:
          description: Distributor specific details
          allOf:
            - $ref: '#/components/schemas/DistributorDetailsDto'
        hospitalDetails:
          description: Hospital specific details
          allOf:
            - $ref: '#/components/schemas/HospitalDetailsDto'
        wholesalerDetails:
          description: Wholesaler specific details
          allOf:
            - $ref: '#/components/schemas/WholesalerDetailsDto'
        exportDetails:
          description: Export specific details
          allOf:
            - $ref: '#/components/schemas/ExportDetailsDto'
        confirmAccurate:
          type: boolean
          description: Confirmation of data accuracy checkbox
          default: true
      required:
        - registrationCode
        - companyName
        - businessType
        - gstNumber
        - panNumber
        - drugLicenseNumber
        - contactPerson
        - designation
        - mobileNumber
        - email
        - billingAddress
        - shippingAddress
        - state
        - country
        - pincode
    AutoValidationResultDto:
      type: object
      properties:
        gstCheck:
          type: string
          example: Valid
        panCheck:
          type: string
          example: Valid
        requiredDocsCheck:
          type: string
          example: Valid
        requiredFieldsCheck:
          type: string
          example: Valid
        overallStatus:
          type: string
          example: Valid
        validationDetails:
          example:
            - GSTIN structure format verified.
            - PAN structure format verified.
            - All 6 required onboarding documents present.
            - Required corporate details populated.
          type: array
          items:
            type: string
        governmentVerified:
          type: boolean
          example: false
          description: True if verified against official government portal
        testingAccepted:
          type: boolean
          example: true
          description: True if accepted for testing purpose
      required:
        - gstCheck
        - panCheck
        - requiredDocsCheck
        - requiredFieldsCheck
        - overallStatus
        - validationDetails
    CustomerVerificationResponseDto:
      type: object
      properties:
        requestCode:
          type: string
          example: CUS-VER-101
        customerName:
          type: string
          example: Vikram Mehta
        companyName:
          type: string
          example: Apex Care Pharma Ltd
        customerType:
          type: string
          example: PCD
        verificationStatus:
          type: string
          example: Under Review
        assignedComplianceOfficer:
          type: string
          example: Rajesh Kumar (Compliance Desk A)
        autoValidation:
          $ref: '#/components/schemas/AutoValidationResultDto'
        customerCode:
          type: string
          example: CUS000101
        createdAt:
          type: string
          example: '2026-10-13T10:00:00.000Z'
      required:
        - requestCode
        - customerName
        - companyName
        - customerType
        - verificationStatus
        - autoValidation
        - createdAt
    ManufacturerStep1Dto:
      type: object
      properties:
        companyName:
          type: string
          maxLength: 150
          example: SunBio LifeSciences Pvt. Ltd.
        facilityAddress:
          type: string
          maxLength: 500
          example: Plot 42, IDA Pashamylaram, Phase III
        city:
          type: string
          maxLength: 100
          example: Hyderabad
        state:
          type: string
          maxLength: 100
          example: Telangana
        pincode:
          type: string
          pattern: ^[1-9][0-9]{5}$
          example: '502307'
          description: 6-digit Indian pincode
        mfgCapacity:
          type: string
          maxLength: 150
          example: 10,000,000 Units / Month
          description: Monthly installed manufacturing capacity
        contactPerson:
          type: string
          maxLength: 150
          example: Dr. Vikram Sethi
        designation:
          type: string
          maxLength: 100
          example: Plant Head / Director
        email:
          type: string
          maxLength: 150
          format: email
          example: plant@sunbiolabs.com
          description: Official plant email (also the login identifier)
        phone:
          type: string
          example: +91 98765 43210
      required:
        - companyName
        - facilityAddress
        - city
        - state
        - pincode
        - mfgCapacity
        - contactPerson
        - designation
        - email
        - phone
    ManufacturerStepResponseDto:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Company details saved successfully
        registrationCode:
          type: string
          example: REG-MFG-1A2B3C4D5E6F7A8B
        currentStep:
          type: number
          example: 1
      required:
        - success
        - message
        - registrationCode
        - currentStep
    ManufacturerDocumentDatesDto:
      type: object
      properties:
        category:
          type: string
          example: mfgLicense
          enum:
            - mfgLicense
            - gmpCert
            - whoGmpCert
            - isoCert
            - factoryReg
            - pollutionCert
        issueDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2023-04-15'
          description: ISO date (YYYY-MM-DD); must not be in the future
        expiryDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2028-04-14'
          description: ISO date (YYYY-MM-DD); must be after issueDate and not already expired
      required:
        - category
        - issueDate
        - expiryDate
    ManufacturerStep2Dto:
      type: object
      properties:
        documents:
          description: Issue/expiry dates for the uploaded certifications
          type: array
          items:
            $ref: '#/components/schemas/ManufacturerDocumentDatesDto'
      required:
        - documents
    ManufacturerStep3Dto:
      type: object
      properties:
        productIds:
          uniqueItems: true
          example:
            - p1
            - p2
          description: Catalogue product IDs; replaces the saved selection
          type: array
          items:
            type: string
      required:
        - productIds
    ManufacturerSupplyItemDto:
      type: object
      properties:
        productId:
          type: string
          example: p1
        moq:
          type: number
          minimum: 1
          maximum: 2000000000
          example: 1000
          description: Minimum order quantity (positive integer)
        leadTimeDays:
          type: number
          minimum: 1
          maximum: 3650
          example: 14
          description: Typical production delivery schedule in days (positive integer)
      required:
        - productId
        - moq
        - leadTimeDays
    ManufacturerStep4Dto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManufacturerSupplyItemDto'
      required:
        - items
    ManufacturerSubmitDto:
      type: object
      properties:
        registrationCode:
          type: string
          example: REG-MFG-1A2B3C4D5E6F7A8B
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: Str0ngPass!
          description: Password for the manufacturer portal login (stored as a bcrypt hash)
        confirmAccurate:
          type: boolean
          example: true
          description: Declaration that all information and documents are accurate
      required:
        - registrationCode
        - password
        - confirmAccurate
    ManufacturerReviewDocumentDto:
      type: object
      properties:
        decision:
          enum:
            - APPROVED
            - REJECTED
            - NEEDS_REPLACEMENT
          type: string
          example: REJECTED
        reason:
          type: string
          maxLength: 500
          example: Certificate is blurred
          description: Mandatory when rejected or replacement is requested
      required:
        - decision
    ApproveVerificationDto:
      type: object
      properties:
        customerCode:
          type: string
          example: CUS000101
          description: Generated customer code if custom
    RejectVerificationDto:
      type: object
      properties:
        rejectionReason:
          type: string
          example: Drug License expired or invalid
          description: Reason for rejection
      required:
        - rejectionReason
    RequestMoreDocsDto:
      type: object
      properties:
        notes:
          example:
            - Please provide updated Form 20B/21B renewal certificate
          type: array
          items:
            type: string
      required:
        - notes
    ReviewDocumentDto:
      type: object
      properties:
        decision:
          enum:
            - APPROVED
            - REJECTED
            - NEEDS_REPLACEMENT
          type: string
          example: REJECTED
          description: Review decision for document
        reason:
          type: string
          maxLength: 500
          example: Seal missing or document blurred
          description: Mandatory if rejected or replacement requested
        reviewer:
          type: string
          maxLength: 150
          example: Rajesh Kumar (Compliance Desk A)
          description: Auditor or officer who reviewed the document (defaults to the authenticated reviewer)
      required:
        - decision
    BuyerRegistrationDto:
      type: object
      properties:
        username:
          type: string
          example: buyer_pharma_01
          minLength: 3
          maxLength: 50
        email:
          type: string
          example: buyer@pharmaco.in
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        phone:
          type: string
        companyName:
          type: string
        companyCode:
          type: string
          description: Generated when omitted.
        department:
          type: string
        jobTitle:
          type: string
      required:
        - username
        - email
        - password
        - fullName
        - companyName
    UserProfileDto:
      type: object
      properties:
        id:
          type: number
        userCode:
          type: string
        username:
          type: string
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
        companyCode:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        jobTitle:
          type: string
          nullable: true
        accountStatus:
          type: string
          example: ACTIVE
        roles:
          example:
            - ROLE_BUYER
          type: array
          items:
            type: string
        lastLoginAt:
          type: string
          nullable: true
      required:
        - id
        - userCode
        - username
        - email
        - fullName
        - phone
        - companyName
        - companyCode
        - department
        - jobTitle
        - accountStatus
        - roles
        - lastLoginAt
    RegistrationResponseDto:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        user:
          $ref: '#/components/schemas/UserProfileDto'
        timestamp:
          type: string
      required:
        - success
        - message
        - user
        - timestamp
    ErrorResponseDto:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: string
          description: Field-level messages, only on validation failures.
          example:
            email: Please provide a valid email address
        status:
          type: number
          example: 401
        error:
          type: string
          example: Unauthorized
        message:
          type: string
        timestamp:
          type: string
        path:
          type: string
      required:
        - status
        - error
        - message
        - timestamp
        - path
    ManufacturerRegistrationDto:
      type: object
      properties:
        username:
          type: string
          example: buyer_pharma_01
          minLength: 3
          maxLength: 50
        email:
          type: string
          example: buyer@pharmaco.in
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        phone:
          type: string
        companyName:
          type: string
        companyCode:
          type: string
          description: Generated when omitted.
        department:
          type: string
        jobTitle:
          type: string
        factoryDetails:
          type: string
          description: Accepted for compatibility; stored by the partner module in Phase 2.
      required:
        - username
        - email
        - password
        - fullName
        - companyName
    LoginDto:
      type: object
      properties:
        usernameOrEmail:
          type: string
          example: admin
        password:
          type: string
        portalType:
          type: string
          description: 'Optional portal check: BUYER, MANUFACTURER, SUPPLIER, FG_STAFF, STAFF or ADMIN.'
      required:
        - usernameOrEmail
        - password
    AuthResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
