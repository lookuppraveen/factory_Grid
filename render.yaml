# ==============================================================================
# FactoryGrid Render Infrastructure as Code (render.yaml)
# Deploys FactoryGrid Backend + Managed PostgreSQL Database
# ==============================================================================

services:
  # ── FactoryGrid Backend Web Service ─────────────────────────────────────────
  - type: web
    name: factorygrid-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8081
      - key: SERVER_PORT
        value: 8081
      - key: DATABASE_URL
        fromDatabase:
          name: factorygrid-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:4173,https://factorygrid.onrender.com"
      - key: THROTTLE_DISABLED
        value: "false"

databases:
  # ── Managed PostgreSQL 17 Database ──────────────────────────────────────────
  - name: factorygrid-db
    databaseName: factorygrid
    user: factorygrid
    plan: starter
    region: oregon
    postgresMajorVersion: "16"

